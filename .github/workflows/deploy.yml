name: Deploy E2Visa Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Laravel Backend to EC2
        uses: appleboy/ssh-action@v1.0.3

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            cd /var/www/e2visa/e2visa-backend-p

            echo "Starting deployment..."

            # Fix permission issues before git operations
            sudo chown -R ubuntu:ubuntu .

            echo "Fetching latest code..."
            git fetch origin

            echo "Resetting to latest main branch..."
            git reset --hard origin/main

            echo "Current deployed commit:"
            git log --oneline -1

            echo "Installing composer dependencies..."
            composer install --no-interaction --prefer-dist --optimize-autoloader

            echo "Clearing Laravel cache..."
            php artisan optimize:clear

            echo "Building Laravel cache..."
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            echo "Fixing Laravel storage permissions..."
            sudo chown -R www-data:www-data storage bootstrap/cache
            sudo chmod -R 775 storage bootstrap/cache

            echo "Restarting services..."
            sudo systemctl restart php8.5-fpm
            sudo systemctl reload nginx

            echo "Deployment completed successfully!"
